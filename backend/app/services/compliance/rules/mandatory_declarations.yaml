- id: LMPC-R6-COO
  rule_ref: "Rule 6 (imported-goods provisions)"
  title: "Country of origin (imported goods only)"
  category: mandatory_declaration
  description: "Required where the commodity is imported."
  default_severity: major
  applies_to_categories: ["imported"]
  exemption_refs: []
  effective_from: "2011-03-01"
  validation_type: "field_present_non_empty"
  field: "country_of_origin"
  fix_example: "Made in Vietnam"
  condition: "is_imported == true"
  penalty_tiers:
    first_offence_max: 25000
    basis: "Section 36(1), LM Act 2009"
  test_cases:
    - name: "missing origin fails"
      fields: {country_of_origin: ""}
      expect_status: fail
    - name: "present origin passes"
      fields: {country_of_origin: "Vietnam"}
      expect_status: pass